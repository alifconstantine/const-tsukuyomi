# Kegagalan font/video/aset mempertahankan menu console dari grub.cfg.
if [ -f /boot/grub/constos/theme.txt -a -f /boot/grub/constos/logo.png ]; then
    if loadfont "$prefix/fonts/unicode.pf2"; then
        if insmod all_video; then
            if insmod gfxterm; then
                if insmod gfxmenu; then
                    if insmod png; then
                        set gfxmode=auto
                        if terminal_output gfxterm; then
                            set theme=/boot/grub/constos/theme.txt
                            export theme
                        fi
                    fi
                fi
            fi
        fi
    fi
fi
