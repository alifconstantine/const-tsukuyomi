set default=0
set timeout=5
set timeout_style=menu
set color_normal=light-gray/black
set color_highlight=white/red
terminal_input console
terminal_output console

# Tema opsional: definisi boot tidak pernah bergantung pada aset grafis.
if [ -f /boot/grub/theme.cfg ]; then
    source /boot/grub/theme.cfg
fi

menuentry 'Install Tsukuyomi' --hotkey=i {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore.img
}

menuentry 'Tsukuyomi Diagnostics (console fallback)' --hotkey=d {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.unit=multi-user.target disablehooks=plymouth plymouth.enable=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore.img
}
