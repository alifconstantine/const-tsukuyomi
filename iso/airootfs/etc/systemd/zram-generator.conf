# =============================================================================
# ConstOS - Memory Management & Paging Configuration (ZRAM)
# =============================================================================
# Mengompresi RAM menggunakan zstd untuk mencegah swapping lambat ke disk (I/O bottleneck)
# dan meningkatkan responsivitas desktop di bawah beban kerja berat.

[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
