# =============================================================================
# ConstOS - Virtual Memory Tuning (Sysctl)
# =============================================================================
# vm.swappiness = 100: Memaksimalkan pemanfaatan ZRAM terkompresi cepat di RAM
# vm.vfs_cache_pressure = 50: Mempertahankan cache inode & dentry filesystem Btrfs di memori
# vm.page-cluster = 0: Membaca single-page secara efisien saat dekompresi ZRAM

vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.page-cluster = 0
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
