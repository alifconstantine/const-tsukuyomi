# Satu jalur: Calamares API 3.4, online x86_64 UEFI, disk kosong.
---
modules-search: [ /usr/lib/constos-installer/modules, local ]
instances:
  - id: preflight
    module: constos
    config: constos-preflight.conf
  - id: storage
    module: constos
    config: constos-storage.conf
  - id: bootstrap
    module: constos
    config: constos-bootstrap.conf
  - id: finalize
    module: constos
    config: constos-finalize.conf
  - id: unmount
    module: constos
    config: constos-unmount.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - constosdisk
      - users
      - summary
  - exec:
      - constos@preflight
      - constos@storage
      - constos@bootstrap
      - machineid
      - locale
      - keyboard
      - localecfg
      - users
      - hwclock
      - constos@finalize
      - constos@unmount
  - show:
      - finished
branding: constos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
