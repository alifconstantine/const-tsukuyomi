---
defaultGroups:
  - wheel
  - name: users
    must_exist: true
    system: false
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: false
passwordRequirements:
  nonempty: true
  minLength: 8
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ liveuser, root, nobody, bin, daemon, dbus, http, ftp, mail, uuidd, systemd-network, systemd-resolve, systemd-timesync ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: constos
  forbidden_names: [ localhost ]
allowActiveDirectory: false
