[workspace]
members = [
    "crates/const-collector",
    "crates/constosctl",
    "crates/constd",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ConstOS Team"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
